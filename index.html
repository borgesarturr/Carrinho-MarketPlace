<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Wuzz Store</h1>
    </header>

    <section id=>
        <main class="vitrine-container">

            <!-- Produto 1: Camisa Preta -->
            <div class="produto-card">
                <img id="img-camisa" src="img-04.jpeg" alt="Camisa Preta" class="produto-imagem">
                <div class="produto-nome">Camisa Preta</div>
                <div class="produto-preco">R$ 99,99</div>
                <button class="btn-adicionar" data-produto="camisa preta">Adicionar ao Carrinho</button>
            </div>

            <!-- Produto 2: Boné Preto -->
            <div class="produto-card">
                <img id="img-bone" src="img-02.jpeg" alt="Boné Preto" class="produto-imagem">
                <div class="produto-nome">Boné Preto</div>
                <div class="produto-preco">R$ 159,90</div>
                <button class="btn-adicionar" data-produto="bone preto">Adicionar ao Carrinho</button>
            </div>

            <!-- Produto 3: Moletom -->
            <div class="produto-card">
                <img id="img-moleton" src="img-01.jpeg" alt="Moletom" class="produto-imagem">
                <div class="produto-nome">Moletom</div>
                <div class="produto-preco">R$ 199,00</div>
                <button class="btn-adicionar" data-produto="moleton">Adicionar ao Carrinho</button>
            </div>

            <!-- Produto 4: Jaqueta de Couro -->
            <div class="produto-card">
                <img id="img-jaqueta" src="img-03.jpeg" alt="Jaqueta Couro" class="produto-imagem">
                <div class="produto-nome">Jaqueta de Couro</div>
                <div class="produto-preco">R$ 399,00</div>
                <button class="btn-adicionar" data-produto="jaqueta couro">Adicionar ao Carrinho</button>
            </div>

        </main>
    </section>

    <!-- Área para exibir o total que criamos antes -->
    <section id="area-carrinho">
        <h2>Seu Carrinho</h2>
        <p id="texto-total">O valor total do carrinho é: R$ 0.00</p>
        <!--Aqui Adicionei um botão para zerar!-->
        <button id="clear-btn">Zerar Carrinho</button>
    </section>

    <script src="script.js"></script>
</body>

</html>
